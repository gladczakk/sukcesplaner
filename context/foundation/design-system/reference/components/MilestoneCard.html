<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MilestoneCard</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/components.css">
<style>.sp-mobile-body > *{flex:none}</style></head>
<body>
<div class="sp-stack sp-pad" style="max-width:320px"><div class="sp-ms sp-ms--risk">
  <span class="sp-ms__mark" style="background:var(--project-sage)"></span>
  <div><div class="sp-ms__name">Akceptacja planu migracji</div><div class="sp-meta">Migracja CRM</div></div>
  <div class="sp-ms__when"><span class="sp-chip sp-chip--tomorrow"><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>jutro</span><span class="sp-meta sp-num">śr, 7 paź</span></div>
  <div class="sp-ms__bar" role="img" aria-label="0 z 2 zadań zrobione"><span style="width:0%"></span></div>
  <div class="sp-ms__when sp-meta sp-num">0/2 zadań zrobione · 2 otwarte</div>
</div><div class="sp-ms sp-ms--risk">
  <span class="sp-ms__mark" style="background:var(--project-kensington)"></span>
  <div><div class="sp-ms__name">Konsultacja przed egzaminem</div><div class="sp-meta">Edukacja domowa</div></div>
  <div class="sp-ms__when"><span class="sp-chip "><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>za 2 dni</span><span class="sp-meta sp-num">czw, 8 paź</span></div>
  <div class="sp-ms__bar" role="img" aria-label="2 z 6 zadań zrobione"><span style="width:33%"></span></div>
  <div class="sp-ms__when sp-meta sp-num">2/6 zadań zrobione · 1 po terminie</div>
</div><div class="sp-ms ">
  <span class="sp-ms__mark" style="background:var(--project-ochre)"></span>
  <div><div class="sp-ms__name">Bieg 15 km na treningu</div><div class="sp-meta">Półmaraton Kraków</div></div>
  <div class="sp-ms__when"><span class="sp-chip "><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>za 5 dni</span><span class="sp-meta sp-num">niedz, 11 paź</span></div>
  <div class="sp-ms__bar" role="img" aria-label="3 z 5 zadań zrobione"><span style="width:60%"></span></div>
  <div class="sp-ms__when sp-meta sp-num">3/5 zadań zrobione</div>
</div></div>
</body>
