<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chip</title>
<link rel="stylesheet" href="../../tokens/tokens.css">
<link rel="stylesheet" href="../../components/components.css">
<style>.sp-mobile-body > *{flex:none}</style></head>
<body>
<div class="sp-stack sp-pad">
<div class="sp-row"><span class="sp-chip sp-chip--overdue"><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>2 dni po terminie</span><span class="sp-chip sp-chip--today"><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>dziś</span><span class="sp-chip sp-chip--tomorrow"><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>jutro</span><span class="sp-chip "><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>czw, 8 paź</span><span class="sp-chip sp-chip--none">bez terminu</span><span class="sp-chip sp-chip--done"><svg class="sp-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>zrobione</span></div>
<div class="sp-row" role="group" aria-label="Obszar życia"><button class="sp-chip sp-chip--filter" aria-pressed="true">Wszystko</button><button class="sp-chip sp-chip--filter" aria-pressed="false">Dom</button><button class="sp-chip sp-chip--filter" aria-pressed="false">Sport</button><button class="sp-chip sp-chip--filter" aria-pressed="false">Praca</button></div>
</div>
</body>
</html>
